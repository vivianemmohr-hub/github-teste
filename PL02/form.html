<h1>Formulário de contacto do CESAE</h1>
    
    <form action="processar.php" method="post">
        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome" required><br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required><br><br>

        <label for="genero">Gênero:</label> <br>
        <input type="radio" id="masculino" name="genero" value="masculino" required> 
        <label for="masculino">Masculino</label> <br>
        <input type="radio" id="feminino" name="genero" value="feminino" required>
        <label for="feminino">Feminino</label><br><br>

        <label for="data_atual">Data Atual:</label>
        <input type="date" id="data_atual" name="data_atual" required><br><br>

        <label for="select">Turma:</label>
        <select id="select" name="select" required>
            <option value="">Selecione</option>
            <option value="opcao1">Web Developer & Mobile</option>
            <option value="opcao2">Outra</option>
        </select><br><br>

        <label for="mensagem">Mensagem:</label>
        <textarea id="mensagem" name="mensagem" rows="3" cols="30" required></textarea><br><br>

        <input type="reset" value="Limpar">
        <input type="submit" value="Enviar">
